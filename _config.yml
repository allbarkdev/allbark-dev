# allbark.dev — built by GitHub Pages' own Jekyll (no Actions, no plugins).
# Plain .html pages without front matter (/byte/*, /social/*) are copied
# through untouched, so their URLs never change. See CONTRIBUTING.md.

title: All Bark
url: https://allbark.dev
baseurl: ""
timezone: America/Los_Angeles
lang: en

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Posts live in _posts/YYYY-MM-DD-wNN-slug.md and publish at /devlog/YYYY/wNN-slug/
permalink: /devlog/:year/:title/

devlog:
  name: The Bark Blog
  tagline: What we built this week, what broke, and how we fixed it.
  author: All Bark
  og_image: /assets/devlog/og-default.png

# Where to follow along. Shown in every page's footer (rel="me" verifies the
# Mastodon profile). Add YouTube and a Discord invite here once they have URLs.
follow:
  - name: Bluesky
    url: https://bsky.app/profile/allbark.dev
  - name: Mastodon
    url: https://mastodon.social/@allbarkdev

# The homebrew tools are a prebuilt SvelteKit site (_tools/sync-homebrew.sh); its
# assets live in homebrew/_app, which Jekyll would skip for the leading underscore.
include:
  - _app
  # App links: Cerberus opens allbark.dev/t/<code> (iOS associated domains, Android app links).
  - .well-known

exclude:
  - README.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - _tools
  - vendor
  - node_modules
  - .DS_Store
