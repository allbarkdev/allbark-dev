<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>All Bark</title>
<meta name="robots" content="noindex" />
<script>
  // An online table's link (allbark.dev/t/<code>), opened where Cerberus isn't installed (with
  // it, the phone opens the app instead): straight to the web app's seat picker with the code.
  // Codes are six of these letters and digits (see frames.ts in allbarkdev/cerberus).
  const m = location.pathname.match(/^\/t\/([CDFGHJKMNPQRTVWX34679]{6})\/?$/i);
  if (m) location.replace(`/play/heroes?t=${m[1].toUpperCase()}`);
</script>
<style>
  /* Follows the system light/dark setting; dark when there isn't one. */
  :root {
    color-scheme: dark light;
    --bg: #1b1710; --card: #241f16; --ink: #ece3d1; --muted: #a2937a;
    --rule: #3d3527; --accent: #8cc063;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4ecd8; --card: #fbf6ea; --ink: #3a2f1f; --muted: #6f6047;
      --rule: #d8c9a8; --accent: #4a7a2c;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4ecd8; --card: #fbf6ea; --ink: #3a2f1f; --muted: #6f6047;
    --rule: #d8c9a8; --accent: #4a7a2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.65 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 16px 64px;
  }
  main { max-width: 480px; margin: 0 auto; background: var(--card); text-align: center;
         border: 1px solid var(--rule); border-radius: 12px; padding: 32px 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 8px 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <section id="lost">
    <h1>Nothing here</h1>
    <p class="muted">That page doesn't exist. <a href="/">Back to All Bark</a></p>
  </section>
</main>
</body>
</html>
