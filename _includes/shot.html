{%- comment -%}
Real app screenshot. Usage:
{% include shot.html src="/assets/devlog/2026-w41/sheet.png" alt="What the screenshot shows" caption="Optional caption" %}
Add wide=true for landscape or desktop captures.
{%- endcomment -%}
<figure class="shot{% if include.wide %} wide{% endif %}">
  <a href="{{ include.src | relative_url }}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async"{% if include.width %} width="{{ include.width }}"{% endif %}{% if include.height %} height="{{ include.height }}"{% endif %} /></a>
  {%- if include.caption %}<figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' | strip }}</figcaption>{% endif %}
</figure>
